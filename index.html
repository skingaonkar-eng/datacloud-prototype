<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Untethered - Prototypes</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0176d3 0%, #032d60 50%, #16325c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 900;
            color: #032d60;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 18px;
            color: #64748b;
        }

        .prototypes-table {
            width: 100%;
            border-collapse: collapse;
        }

        .prototypes-table th {
            text-align: left;
            padding: 16px;
            background: #f8fafc;
            color: #1e293b;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        .prototypes-table td {
            padding: 20px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .prototype-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .launch-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0176d3, #1a8fe8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(1, 118, 211, 0.4);
        }

        .launch-btn svg {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            .header h1 {
                font-size: 32px;
            }

            .prototypes-table {
                font-size: 14px;
            }

            .prototype-name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Project Untethered</h1>
            <p>Agentic Segmentation Workspace Prototypes</p>
        </div>

        <table class="prototypes-table">
            <thead>
                <tr>
                    <th>Prototype</th>
                    <th style="text-align: right;">Launch</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="prototype-name">Data Cloud Segment Builder</div>
                    </td>
                    <td style="text-align: right;">
                        <a href="datacloud-prototype.html" class="launch-btn">
                            Launch
                            <svg fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                            </svg>
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="prototype-name">Slack + Data Cloud Agent</div>
                    </td>
                    <td style="text-align: right;">
                        <a href="prototype-shareable.html" class="launch-btn">
                            Launch
                            <svg fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                            </svg>
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="prototype-name">Reimagined Marketer Experience</div>
                    </td>
                    <td style="text-align: right;">
                        <a href="reimagined-marketer-experience/" class="launch-btn">
                            Launch
                            <svg fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                            </svg>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
