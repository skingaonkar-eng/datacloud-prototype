<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --marine-900: #052E3F;
            --marine-800: #0A4D68;
            --marine-700: #0a5a7a;
            --marine-600: #088395;
            --marine-500: #05BFDB;
            --marine-400: #6ed4e2;
            --marine-50: #eff9fb;

            --gray-900: #0f172a;
            --gray-800: #1e293b;
            --gray-700: #334155;
            --gray-600: #475569;
            --gray-500: #64748b;
            --gray-400: #94a3b8;
            --gray-300: #cbd5e1;
            --gray-200: #e2e8f0;
            --gray-100: #f1f5f9;
            --gray-50: #f8fafc;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.10);
            --shadow-xl: 0 20px 48px rgba(15, 23, 42, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #eff9fb 0%, #ffffff 50%, #eff9fb 100%);
            color: var(--gray-900);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        .app-shell {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* ─── HEADER ───────────────────────────────────────── */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--gray-200);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--marine-700), var(--marine-500));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 700;
            box-shadow: var(--shadow-md);
        }

        .brand-text h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 14px;
            color: var(--gray-500);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: var(--gray-100);
            color: var(--gray-600);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .sync-pill.synced {
            background: #ecfdf5;
            color: #047857;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--marine-700), var(--marine-600));
            color: white;
            box-shadow: 0 2px 8px rgba(8, 131, 149, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(8, 131, 149, 0.4);
        }

        .btn-ghost {
            background: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-ghost:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        /* ─── SUMMARY ──────────────────────────────────────── */
        .summary-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .summary-toggle {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .summary-toggle:hover {
            background: var(--gray-50);
        }

        .summary-toggle-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .summary-toggle-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--marine-50), white);
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--marine-700);
            font-size: 16px;
        }

        .summary-toggle-text {
            font-weight: 600;
            font-size: 15px;
            color: var(--gray-900);
        }

        .summary-toggle-text small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--gray-500);
            margin-top: 1px;
        }

        .chevron {
            color: var(--gray-400);
            transition: transform 0.2s;
            font-size: 14px;
        }

        .summary-card.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .summary-body {
            padding: 8px 24px 24px;
            border-top: 1px solid var(--gray-100);
        }

        .summary-card.collapsed .summary-body {
            display: none;
        }

        .summary-topic {
            margin-top: 20px;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .summary-topic-header {
            background: linear-gradient(135deg, var(--marine-800), var(--marine-600));
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .summary-topic-name {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.2px;
        }

        .summary-topic-meta {
            display: flex;
            gap: 8px;
        }

        .summary-meta-pill {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        .summary-task {
            padding: 14px 20px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .summary-task:last-child {
            border-bottom: none;
        }

        .summary-task-content {
            flex: 1;
        }

        .summary-task-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-800);
            line-height: 1.5;
        }

        .summary-task-name.done {
            text-decoration: line-through;
            color: var(--gray-400);
        }

        .summary-task-update {
            margin-top: 6px;
            font-size: 13px;
            color: var(--gray-600);
            line-height: 1.5;
        }

        .summary-task-update-date {
            color: var(--marine-600);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 6px;
        }

        /* ─── WEEK CARD ─────────────────────────────────────── */
        .week-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .week-card:hover {
            box-shadow: var(--shadow-md);
        }

        .week-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--marine-800), var(--marine-600));
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .week-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .week-header .chevron {
            color: rgba(255, 255, 255, 0.8);
        }

        .week-card.collapsed .week-header .chevron {
            transform: rotate(-90deg);
        }

        .week-dates {
            display: flex;
            flex-direction: column;
            gap: 2px;
            line-height: 1.2;
        }

        .week-label {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .week-label-primary {
            font-weight: 700;
            font-size: 16px;
            color: white;
            letter-spacing: -0.2px;
        }

        .week-label-relative {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
        }

        .week-label-relative.current {
            background: white;
            color: var(--marine-800);
        }

        .week-label-secondary {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }

        .date-edit-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
            margin-left: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .date-edit-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            opacity: 1;
        }

        .date-inputs-wrap {
            display: none;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--marine-800), var(--marine-600));
        }

        .date-inputs-wrap.show {
            display: flex;
        }

        .date-input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
        }

        .date-input:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .date-input:focus {
            outline: none;
            background: white;
            color: var(--marine-800);
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .date-input:focus::-webkit-calendar-picker-indicator {
            filter: invert(0);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.15s;
            opacity: 0.85;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            opacity: 1;
        }

        .icon-btn-danger:hover {
            background: rgba(239, 68, 68, 0.5);
        }

        .week-body {
            padding: 4px 0 12px;
        }

        .week-card.collapsed .week-body {
            display: none;
        }

        /* ─── TOPIC ─────────────────────────────────────────── */
        .topic {
            margin: 16px 16px 8px;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            overflow: hidden;
            background: white;
            transition: border-color 0.15s;
        }

        .topic:hover {
            border-color: var(--marine-400);
        }

        .topic-header {
            padding: 12px 18px;
            background: linear-gradient(135deg, var(--marine-50), white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gray-200);
        }

        .topic-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .topic-marker {
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--marine-700), var(--marine-500));
            border-radius: 2px;
        }

        .topic-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--marine-900);
            letter-spacing: -0.2px;
            cursor: text;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .topic-name:hover {
            background: rgba(8, 131, 149, 0.08);
        }

        .topic-task-count {
            font-size: 12px;
            color: var(--gray-500);
            background: white;
            padding: 2px 10px;
            border-radius: 100px;
            border: 1px solid var(--gray-200);
            font-weight: 600;
        }

        .topic-actions {
            display: flex;
            gap: 4px;
        }

        .topic-icon-btn {
            width: 28px;
            height: 28px;
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-500);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.15s;
        }

        .topic-icon-btn:hover {
            color: var(--marine-700);
            border-color: var(--marine-400);
            background: var(--marine-50);
        }

        .topic-icon-btn.danger:hover {
            color: #dc2626;
            border-color: #fca5a5;
            background: #fef2f2;
        }

        /* ─── TASK TABLE ────────────────────────────────────── */
        .task-table-head {
            display: grid;
            grid-template-columns: minmax(0, 2.5fr) 160px 44px minmax(0, 3fr) 80px;
            gap: 16px;
            padding: 10px 18px;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .task-table-head .col-done {
            text-align: center;
        }

        .task-row {
            display: grid;
            grid-template-columns: minmax(0, 2.5fr) 160px 44px minmax(0, 3fr) 80px;
            gap: 16px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--gray-100);
            align-items: start;
            transition: background 0.15s;
        }

        .task-row:hover {
            background: var(--gray-50);
        }

        .task-row:last-child {
            border-bottom: none;
        }

        .task-name {
            font-size: 14px;
            color: var(--gray-800);
            font-weight: 500;
            line-height: 1.6;
            cursor: text;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.15s;
            min-height: 32px;
            word-wrap: break-word;
        }

        .task-name:hover {
            background: white;
            box-shadow: inset 0 0 0 1px var(--gray-200);
        }

        .task-name.done {
            text-decoration: line-through;
            color: var(--gray-400);
        }

        .inline-input {
            width: 100%;
            padding: 6px 8px;
            border: 2px solid var(--marine-500);
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .inline-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--marine-500);
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 70px;
            outline: none;
        }

        /* ─── STATUS DROPDOWN ───────────────────────────────── */
        .status-select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            outline: none;
            transition: all 0.15s;
        }

        .status-select:focus {
            box-shadow: 0 0 0 3px rgba(8, 131, 149, 0.15);
        }

        .status-select.todo {
            background: #fffbeb;
            color: #92400e;
            border-color: #fde68a;
        }

        .status-select.progress {
            background: #eff6ff;
            color: #1e40af;
            border-color: #bfdbfe;
        }

        .status-select.done {
            background: #f0fdf4;
            color: #166534;
            border-color: #bbf7d0;
        }

        .status-select.blocked {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
        }

        /* ─── CHECKBOX ─────────────────────────────────────── */
        .check-cell {
            display: flex;
            justify-content: center;
            padding-top: 8px;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--marine-600);
        }

        /* ─── UPDATES & COMMENTS ────────────────────────────── */
        .updates-cell {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feed-item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            border-left: 3px solid;
        }

        .feed-item.update {
            background: linear-gradient(135deg, var(--marine-50), #ffffff);
            border-left-color: var(--marine-500);
        }

        .feed-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: var(--marine-600);
        }

        .feed-text {
            color: var(--gray-700);
            white-space: pre-wrap;
            word-wrap: break-word;
            cursor: text;
        }

        .feed-item-wrap {
            position: relative;
        }

        .feed-actions-inline {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 4px;
            opacity: 0.4;
            transition: opacity 0.15s;
        }

        .feed-item-wrap:hover .feed-actions-inline {
            opacity: 1;
        }

        .feed-action-btn {
            width: 24px;
            height: 24px;
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-500);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: all 0.15s;
        }

        .feed-action-btn:hover {
            color: var(--marine-700);
            border-color: var(--marine-400);
            background: var(--marine-50);
        }

        .feed-action-btn.danger:hover {
            color: #dc2626;
            border-color: #fca5a5;
            background: #fef2f2;
        }

        .empty-state {
            color: var(--gray-400);
            font-size: 12px;
            font-style: italic;
            padding: 4px 8px;
        }

        .feed-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .feed-btn {
            flex: 1;
            background: white;
            border: 1px dashed var(--gray-300);
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-600);
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .feed-btn.update-btn:hover {
            background: var(--marine-50);
            border-color: var(--marine-500);
            border-style: solid;
            color: var(--marine-700);
        }

        .save-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .save-btn {
            background: var(--marine-600);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .save-btn:hover {
            background: var(--marine-700);
        }

        .cancel-btn {
            background: var(--gray-100);
            color: var(--gray-700);
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .cancel-btn:hover {
            background: var(--gray-200);
        }

        /* ─── ROW ACTIONS ───────────────────────────────────── */
        .row-actions {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            padding-top: 4px;
            opacity: 0.4;
            transition: opacity 0.15s;
        }

        .task-row:hover .row-actions {
            opacity: 1;
        }

        .row-icon-btn {
            width: 28px;
            height: 28px;
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-500);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.15s;
        }

        .row-icon-btn:hover {
            color: #dc2626;
            border-color: #fca5a5;
            background: #fef2f2;
        }

        /* ─── ADD BUTTONS ───────────────────────────────────── */
        .add-task-btn {
            width: calc(100% - 36px);
            margin: 12px 18px;
            padding: 10px;
            background: white;
            border: 1px dashed var(--gray-300);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-500);
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            display: flex;

        /* ─── HIGHLIGHT NEW ─────────────────────────────────── */
        @keyframes highlight {

        .highlight-new {
            animation: highlight 1.8s ease-out;

        .loading {

        @media (max-width: 900px) {
            .task-table-head, .task-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .task-table-head { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">W</div>
                <div class="brand-text">
                    <h1>Weekly Progress</h1>
                    <p>
                        Track tasks, updates, and feedback by week
                        <span class="sync-pill" id="syncPill">
                            <span class="sync-dot"></span>
                            <span id="syncText">Syncing</span>
                        </span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="addWeek()">
                    <span>+</span> New Week
                </button>
            </div>
        </header>

        <div class="summary-card collapsed" id="summaryCard">
            <div class="summary-toggle" onclick="toggleSummary()">
                <div class="summary-toggle-left">
                    <div class="summary-toggle-icon">≡</div>
                    <div class="summary-toggle-text">
                        Summary
                        <small>Latest status & updates across all weeks, grouped by topic</small>
                    </div>
                </div>
                <span class="chevron">▼</span>
            </div>
            <div class="summary-body" id="summaryBody"></div>
        </div>

        <div id="weeksList">
            <div class="loading">Loading your tracker...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBO4ZSNWY3XJjVz5TkK2dOXIDRUZZCph44",
            authDomain: "weekly-tracker-e184a.firebaseapp.com",
            databaseURL: "https://weekly-tracker-e184a-default-rtdb.firebaseio.com",
            projectId: "weekly-tracker-e184a",
            storageBucket: "weekly-tracker-e184a.firebasestorage.app",
            messagingSenderId: "446246408009",
            appId: "1:446246408009:web:7dba73e9fa68400bc6d498",
            measurementId: "G-QES5R2BMLD"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        let weekData = [];
        let highlightTarget = null;
        let pendingSaves = 0;

        const dataRef = ref(database, 'sharedWeekData');
        onValue(dataRef, (snapshot) => {
            // Don't accept incoming data while our saves are in flight
            if (pendingSaves > 0) return;

            const data = snapshot.val();
            if (!data) {
                weekData = getDefaultData();
                saveData();
                return;
            }
            // If incoming matches our local state, no need to re-render
            if (JSON.stringify(data) === JSON.stringify(weekData)) {
                setSyncStatus(true);
                return;
            }
            weekData = data;
            renderWeeks();
            setSyncStatus(true);
        });

        function getDefaultData() {
            return [
                {
                    weekStart: '2026-05-13',
                    weekEnd: '2026-05-19',
                    categoryOrder: ['Reimagined Experience', 'Segment Approval Workflow', 'Streaming Segmentation'],
                    categories: {
                        'Reimagined Experience': [
                            { text: 'Walk-through the latest Data 360 experience to Engineering', status: 'todo', updates: [], comments: [] },

                        ],

                    }
                },
                {
                    weekStart: '2026-04-29',
                    weekEnd: '2026-05-05',
                    categoryOrder: ['Reimagined Experience', 'Streaming Segmentation', 'Segment Approval Workflow', 'SQL based Segments'],
                    categories: {
                        'Reimagined Experience': [
                            { text: 'Discuss with Luke to pick-up the pace of prototype updates', status: 'todo', updates: [], comments: [] },
                            { text: 'Take more control of vibe coding prototype as needed', status: 'todo', updates: [], comments: [] },
                            { text: 'Need to update prototype for full parity on segmentation builder from slack and Data 360 UI', status: 'todo', updates: [], comments: [] },
                            { text: 'Discuss with Brad on above', status: 'todo', updates: [], comments: [] },
                            { text: 'Start with user testing plan', status: 'todo', updates: [], comments: [] },
                            { text: 'Work with Sameer/Darshna on AI accuracy for natural language segment creation', status: 'todo', updates: [], comments: [] }
                        ],
                        'Streaming Segmentation': [
                            { text: 'Start a thread with Lucie to understand any particular use-cases that could not be solved by real-time or data actions', status: 'todo', updates: [], comments: [] }
                        ],
                        'Segment Approval Workflow': [
                            { text: 'Wait for Elevance to come back on requirements', status: 'todo', updates: [], comments: [] },
                            { text: 'Understand from Mandeep on challenges in Core object approach', status: 'todo', updates: [], comments: [] }
                        ],
                        'SQL based Segments': [
                            { text: 'Need product thinking on sql based containers in UI segments', status: 'todo', updates: [], comments: [] },
                            { text: 'Evaluate bandwidth and transition topic to other PMs if needed', status: 'todo', updates: [], comments: [] }
                        ]
                    }
                }
            ];
        }

        function setSyncStatus(synced) {
            const pill = document.getElementById('syncPill');
            const text = document.getElementById('syncText');
            if (synced) {
                pill.classList.add('synced');
                text.textContent = 'Synced';
            } else {
                pill.classList.remove('synced');
                text.textContent = 'Syncing';
            }
        }

        window.saveData = function() {
            setSyncStatus(false);
            pendingSaves++;
            set(ref(database, 'sharedWeekData'), weekData)
                .then(() => {
                    pendingSaves = Math.max(0, pendingSaves - 1);
                    if (pendingSaves === 0) setSyncStatus(true);
                })
                .catch(err => {
                    pendingSaves = Math.max(0, pendingSaves - 1);
                    console.error('Save error:', err);
                });
        };

        const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        function parseDate(str) {
            if (!str) return null;
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatWeekDates(startStr, endStr) {
            const start = parseDate(startStr);
            const end = parseDate(endStr);
            if (!start || !end) return { primary: 'Unknown week', secondary: '', relative: '' };

            const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
            const sameYear = start.getFullYear() === end.getFullYear();

            const primary = `Week of ${MONTH_NAMES[start.getMonth()]} ${start.getDate()}`;
            let secondary;
            if (sameMonth) {
                secondary = `${MONTH_NAMES[start.getMonth()]} ${start.getDate()}–${end.getDate()}, ${start.getFullYear()}`;
            } else if (sameYear) {
                secondary = `${MONTH_NAMES[start.getMonth()]} ${start.getDate()} – ${MONTH_NAMES[end.getMonth()]} ${end.getDate()}, ${start.getFullYear()}`;
            } else {
                secondary = `${MONTH_NAMES[start.getMonth()]} ${start.getDate()}, ${start.getFullYear()} – ${MONTH_NAMES[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
            }

            return { primary, secondary, relative: getRelativeWeekLabel(start, end) };
        }

        function getRelativeWeekLabel(start, end) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Get current week's Monday
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            const thisMonday = new Date(today);
            thisMonday.setDate(diff);
            thisMonday.setHours(0, 0, 0, 0);

            const weekMs = 7 * 24 * 60 * 60 * 1000;
            const weeksDiff = Math.round((start.getTime() - thisMonday.getTime()) / weekMs);

            if (today >= start && today <= end) return 'This week';
            if (weeksDiff === -1) return 'Last week';
            if (weeksDiff === 1) return 'Next week';
            if (weeksDiff < -1) return `${Math.abs(weeksDiff)} weeks ago`;
            if (weeksDiff > 1) return `In ${weeksDiff} weeks`;
            return '';
        }

        function escAttr(str) {
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escText(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escJs(str) {
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function getCategoryOrder(week) {
            if (!week.categoryOrder || !Array.isArray(week.categoryOrder)) {
                week.categoryOrder = Object.keys(week.categories || {});
            }
            // Ensure all current categories are in order
            Object.keys(week.categories || {}).forEach(cat => {
                if (!week.categoryOrder.includes(cat)) {
                    week.categoryOrder.push(cat);
                }
            });
            // Filter out non-existent
            week.categoryOrder = week.categoryOrder.filter(cat => week.categories && week.categories[cat]);
            return week.categoryOrder;
        }

        function captureUIState() {
            const expandedWeeks = new Set();
            document.querySelectorAll('.week-card').forEach(el => {
                if (!el.classList.contains('collapsed')) {
                    expandedWeeks.add(el.id);
                }
            });
            const summaryOpen = !document.getElementById('summaryCard')?.classList.contains('collapsed');
            const scrollY = window.scrollY;
            return { expandedWeeks, summaryOpen, scrollY };
        }

        function restoreUIState(state) {
            if (!state) return;
            // First, collapse all weeks (default for index > 0)
            document.querySelectorAll('.week-card').forEach(el => {
                if (state.expandedWeeks.has(el.id)) {
                    el.classList.remove('collapsed');
                } else {
                    // Only collapse if it wasn't expanded before
                    if (el.id !== 'week-0' || !state.expandedWeeks.has('week-0')) {
                        // Keep default behavior — only week-0 is open by default
                    }
                }
            });
            // Restore summary state
            const summaryCard = document.getElementById('summaryCard');
            if (summaryCard) {
                if (state.summaryOpen) {
                    summaryCard.classList.remove('collapsed');
                } else {
                    summaryCard.classList.add('collapsed');
                }
            }
            // Restore scroll position
            window.scrollTo(0, state.scrollY);
        }

        window.renderWeeks = function() {
            const weeksList = document.getElementById('weeksList');
            if (!weekData || weekData.length === 0) {
                weeksList.innerHTML = `<div class="loading">No weeks yet. Click "+ New Week" above to get started.</div>`;
                return;
            }

            const uiState = captureUIState();

            weeksList.innerHTML = weekData.map((week, wi) => renderWeek(week, wi, uiState)).join('');

            restoreUIState(uiState);

            // Apply highlight if needed (overrides scroll restore)
            if (highlightTarget) {
                const target = document.querySelector(highlightTarget.selector);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.classList.add('highlight-new');
                    setTimeout(() => target.classList.remove('highlight-new'), 1800);
                }
                highlightTarget = null;
            }
        };

        function renderWeek(week, wi, uiState) {
            // If we have UI state, respect it; otherwise default first week open
            let collapsed;
            if (uiState && uiState.expandedWeeks && uiState.expandedWeeks.size > 0) {
                collapsed = uiState.expandedWeeks.has(`week-${wi}`) ? '' : 'collapsed';
            } else {
                collapsed = wi > 0 ? 'collapsed' : '';
            }
            const order = getCategoryOrder(week);
            const labels = formatWeekDates(week.weekStart, week.weekEnd);
            const isCurrent = labels.relative === 'This week';
            return `
                <div class="week-card ${collapsed}" id="week-${wi}">
                    <div class="week-header">
                        <div class="week-header-left" onclick="toggleWeek(${wi})">
                            <span class="chevron">▼</span>
                            <div class="week-dates">
                                <div class="week-label">
                                    <span class="week-label-primary">${escText(labels.primary)}</span>
                                    ${labels.relative ? `<span class="week-label-relative ${isCurrent ? 'current' : ''}">${escText(labels.relative)}</span>` : ''}
                                </div>
                                <span class="week-label-secondary">${escText(labels.secondary)}</span>
                            </div>
                            <button class="date-edit-toggle" title="Edit dates"
                                    onclick="toggleDateEdit(${wi}); event.stopPropagation();">📅</button>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="icon-btn icon-btn-danger" title="Delete week"
                                    onclick="deleteWeek(${wi}); event.stopPropagation();">🗑</button>
                        </div>
                    </div>
                    <div class="date-inputs-wrap" id="date-edit-${wi}" style="padding:0 20px 14px;">
                        <span style="color:rgba(255,255,255,0.85); font-size:12px; font-weight:600;">From:</span>
                        <input type="date" class="date-input" value="${escAttr(week.weekStart)}"
                               onchange="updateWeekDate(${wi}, 'start', this.value)">
                        <span style="color:rgba(255,255,255,0.85); font-size:12px; font-weight:600;">To:</span>
                        <input type="date" class="date-input" value="${escAttr(week.weekEnd)}"
                               onchange="updateWeekDate(${wi}, 'end', this.value)">
                    </div>
                    <div class="week-body">
                        ${order.map(cat => renderTopic(week, wi, cat)).join('')}
                        <button class="add-topic-btn" onclick="addTopic(${wi})">
                            <span>+</span> Add Topic
                        </button>
                    </div>
                </div>
            `;
        }

        function renderTopic(week, wi, category) {
            const tasks = week.categories[category] || [];
            return `
                <div class="topic" id="topic-${wi}-${escAttr(category)}">
                    <div class="topic-header">
                        <div class="topic-header-left">
                            <div class="topic-marker"></div>
                            <div class="topic-name" onclick="editTopicName(${wi}, '${escJs(category)}', this)">${escText(category)}</div>
                            <span class="topic-task-count">${tasks.length} task${tasks.length === 1 ? '' : 's'}</span>
                        </div>
                        <div class="topic-actions">
                            <button class="topic-icon-btn danger" title="Delete topic"
                                    onclick="deleteTopic(${wi}, '${escJs(category)}')">🗑</button>
                        </div>
                    </div>
                    <div class="task-table-head">
                        <div>Task</div>
                        <div>Status</div>
                        <div class="col-done">Done</div>
                        <div>Updates</div>
                        <div></div>
                    </div>
                    <div>
                        ${tasks.map((task, ti) => renderTaskRow(wi, category, ti, task)).join('')}
                    </div>
                    <button class="add-task-btn" onclick="addTask(${wi}, '${escJs(category)}')">
                        <span>+</span> Add Task
                    </button>
                </div>
            `;
        }

        function renderTaskRow(wi, category, ti, task) {
            const updates = task.updates || [];
            const taskKey = `${wi}-${escAttr(category)}-${ti}`;
            return `
                <div class="task-row" id="task-${taskKey}">
                    <div class="task-name ${task.status === 'done' ? 'done' : ''}"
                         onclick="editTaskName(${wi}, '${escJs(category)}', ${ti}, this)">${escText(task.text)}</div>
                    <div>
                        <select class="status-select ${task.status}"
                                onchange="changeStatus(${wi}, '${escJs(category)}', ${ti}, this.value)">
                            <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>To Do</option>
                            <option value="progress" ${task.status === 'progress' ? 'selected' : ''}>In Progress</option>
                            <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
                            <option value="blocked" ${task.status === 'blocked' ? 'selected' : ''}>Blocked</option>
                        </select>
                    </div>
                    <div class="check-cell">
                        <input type="checkbox" class="task-checkbox" ${task.status === 'done' ? 'checked' : ''}
                               onchange="toggleDone(${wi}, '${escJs(category)}', ${ti})">
                    </div>
                    <div class="updates-cell">
                        ${updates.length === 0
                            ? '<div class="empty-state">No updates yet</div>'
                            : ''}
                        ${updates.map((u, ui) => `
                            <div class="feed-item-wrap" id="update-${taskKey}-${ui}">
                                <div class="feed-item update">
                                    <div class="feed-meta">📝 ${escText(u.date)}</div>
                                    <div class="feed-text">${escText(u.text)}</div>
                                </div>
                                <div class="feed-actions-inline">
                                    <button class="feed-action-btn" title="Edit"
                                            onclick="editUpdate(${wi}, '${escJs(category)}', ${ti}, ${ui})">✎</button>
                                    <button class="feed-action-btn danger" title="Delete"
                                            onclick="deleteUpdate(${wi}, '${escJs(category)}', ${ti}, ${ui})">🗑</button>
                                </div>
                            </div>
                        `).join('')}
                        <div id="new-feed-${taskKey}"></div>
                        <div class="feed-actions">
                            <button class="feed-btn update-btn" onclick="addUpdate(${wi}, '${escJs(category)}', ${ti})">
                                <span>+</span> Add Update
                            </button>
                        </div>
                    </div>
                    <div class="row-actions">
                        <button class="row-icon-btn" title="Delete task"
                                onclick="deleteTask(${wi}, '${escJs(category)}', ${ti})">🗑</button>
                    </div>
                </div>
            `;
        }

        // ─── WEEK ACTIONS ────────────────────────────────────
        window.toggleWeek = function(wi) {
            document.getElementById(`week-${wi}`).classList.toggle('collapsed');
        };

        window.addWeek = function() {
            const today = new Date();
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1); // Monday
            const monday = new Date(today.setDate(diff));
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            weekData.unshift({
                weekStart: monday.toISOString().split('T')[0],
                weekEnd: sunday.toISOString().split('T')[0],
                categoryOrder: [],
                categories: {}
            });
            highlightTarget = { selector: '#week-0' };
            saveData();
        };

        window.deleteWeek = function(wi) {
            if (confirm('Delete this entire week and all its tasks?')) {
                weekData.splice(wi, 1);
                saveData();
            }
        };

        window.updateWeekDate = function(wi, type, value) {
            if (type === 'start') weekData[wi].weekStart = value;
            else weekData[wi].weekEnd = value;

            // Update the label display in place
            const card = document.getElementById(`week-${wi}`);
            if (card) {
                const labels = formatWeekDates(weekData[wi].weekStart, weekData[wi].weekEnd);
                const primary = card.querySelector('.week-label-primary');
                const secondary = card.querySelector('.week-label-secondary');
                const relative = card.querySelector('.week-label-relative');
                if (primary) primary.textContent = labels.primary;
                if (secondary) secondary.textContent = labels.secondary;
                if (relative) {
                    relative.textContent = labels.relative;
                    if (labels.relative === 'This week') relative.classList.add('current');
                    else relative.classList.remove('current');
                }
            }

            saveData();
        };

        window.toggleDateEdit = function(wi) {
            const wrap = document.getElementById(`date-edit-${wi}`);
            if (wrap) wrap.classList.toggle('show');
        };

        // ─── TOPIC ACTIONS ───────────────────────────────────
        window.addTopic = function(wi) {
            const newName = 'New Topic';
            let finalName = newName;
            let counter = 1;
            while (weekData[wi].categories[finalName]) {
                finalName = `${newName} ${++counter}`;
            }
            weekData[wi].categories[finalName] = [
                { text: 'New task', status: 'todo', updates: [], comments: [] }
            ];
            getCategoryOrder(weekData[wi]); // sync order
            weekData[wi].categoryOrder.push(finalName);
            highlightTarget = { selector: `#topic-${wi}-${escAttr(finalName)}` };
            saveData();
        };

        window.deleteTopic = function(wi, category) {
            if (confirm(`Delete topic "${category}" and all its tasks?`)) {
                delete weekData[wi].categories[category];
                if (weekData[wi].categoryOrder) {
                    weekData[wi].categoryOrder = weekData[wi].categoryOrder.filter(c => c !== category);
                }
                saveData();
            }
        };

        window.editTopicName = function(wi, oldName, el) {
            if (el.dataset.editing === 'true') return;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'inline-input';
            input.value = oldName;
            input.dataset.editing = 'true';

            const restoreText = (text) => {
                const newDiv = document.createElement('div');
                newDiv.className = 'topic-name';
                newDiv.textContent = text;
                newDiv.onclick = () => window.editTopicName(wi, text, newDiv);
                if (input.parentNode) input.parentNode.replaceChild(newDiv, input);
            };

            let finished = false;
            const finish = (save) => {
                if (finished) return;
                finished = true;

                const newName = input.value.trim();
                if (!save || !newName || newName === oldName) {
                    restoreText(oldName);
                    return;
                }
                if (weekData[wi].categories[newName]) {
                    alert('A topic with that name already exists');
                    restoreText(oldName);
                    return;
                }
                // Apply rename
                weekData[wi].categories[newName] = weekData[wi].categories[oldName];
                delete weekData[wi].categories[oldName];
                getCategoryOrder(weekData[wi]);
                const idx = weekData[wi].categoryOrder.indexOf(oldName);
                if (idx !== -1) weekData[wi].categoryOrder[idx] = newName;

                restoreText(newName);
                // Full re-render needed because IDs/handlers reference category name
                saveData();
                renderWeeks();
            };

            input.addEventListener('blur', () => finish(true));
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    finish(false);
                }
            });

            el.replaceWith(input);
            input.focus();
            input.select();
        };

        // ─── TASK ACTIONS ────────────────────────────────────
        window.addTask = function(wi, category) {
            weekData[wi].categories[category].push({
                text: 'New task',
                status: 'todo',
                updates: [],
                comments: []
            });
            const newIdx = weekData[wi].categories[category].length - 1;
            highlightTarget = { selector: `#task-${wi}-${escAttr(category)}-${newIdx}` };
            saveData();
        };

        window.deleteTask = function(wi, category, ti) {
            if (confirm('Delete this task?')) {
                weekData[wi].categories[category].splice(ti, 1);
                saveData();
            }
        };

        window.editTaskName = function(wi, category, ti, el) {
            // Don't double-init if already editing
            if (el.dataset.editing === 'true') return;

            const task = weekData[wi].categories[category][ti];
            const originalText = task.text;
            const taskKey = `${wi}-${escAttr(category)}-${ti}`;

            // Build input
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'inline-input';
            input.value = originalText;
            input.dataset.editing = 'true';

            // Helper to swap input back to text div with given content
            const restoreText = (text, status) => {
                const newDiv = document.createElement('div');
                newDiv.className = 'task-name' + (status === 'done' ? ' done' : '');
                newDiv.textContent = text;
                newDiv.onclick = () => window.editTaskName(wi, category, ti, newDiv);
                if (input.parentNode) input.parentNode.replaceChild(newDiv, input);
            };

            let finished = false;
            const finish = (save) => {
                if (finished) return;
                finished = true;

                const newValue = input.value.trim();
                if (save && newValue && newValue !== originalText) {
                    weekData[wi].categories[category][ti].text = newValue;
                    restoreText(newValue, task.status);
                    saveData();
                } else {
                    // Revert without saving
                    restoreText(originalText, task.status);
                }
            };

            input.addEventListener('blur', () => finish(true));
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    finish(false);
                }
            });

            // Replace text div with input, then focus
            el.replaceWith(input);
            input.focus();
            input.select();
        };

        window.changeStatus = function(wi, category, ti, status) {
            weekData[wi].categories[category][ti].status = status;

            // Update DOM directly without full re-render
            const taskKey = `${wi}-${escAttr(category)}-${ti}`;
            const row = document.getElementById(`task-${taskKey}`);
            if (row) {
                const select = row.querySelector('.status-select');
                if (select) {
                    select.classList.remove('todo', 'progress', 'done', 'blocked');
                    select.classList.add(status);
                }
                const checkbox = row.querySelector('.task-checkbox');
                if (checkbox) checkbox.checked = (status === 'done');
                const taskName = row.querySelector('.task-name');
                if (taskName) {
                    if (status === 'done') taskName.classList.add('done');
                    else taskName.classList.remove('done');
                }
            }

            saveData();
        };

        window.toggleDone = function(wi, category, ti) {
            const t = weekData[wi].categories[category][ti];
            t.status = t.status === 'done' ? 'todo' : 'done';

            // Update DOM directly
            const taskKey = `${wi}-${escAttr(category)}-${ti}`;
            const row = document.getElementById(`task-${taskKey}`);
            if (row) {
                const select = row.querySelector('.status-select');
                if (select) {
                    select.classList.remove('todo', 'progress', 'done', 'blocked');
                    select.classList.add(t.status);
                    select.value = t.status;
                }
                const taskName = row.querySelector('.task-name');
                if (taskName) {
                    if (t.status === 'done') taskName.classList.add('done');
                    else taskName.classList.remove('done');
                }
            }

            saveData();
        };

        // ─── UPDATES ─────────────────────────────────────────
        window.addUpdate = function(wi, category, ti) {
            const containerId = `new-feed-${wi}-${escAttr(category)}-${ti}`;
            const container = document.getElementById(containerId);
            if (!container || container.innerHTML) return;

            const today = new Date().toISOString().split('T')[0];
            container.innerHTML = `
                <div class="feed-item update">
                    <div class="feed-meta">📝 ${today}</div>
                    <textarea class="inline-textarea" placeholder="What's the latest progress?"></textarea>
                    <div class="save-row">
                        <button class="save-btn" data-action="save">Save</button>
                        <button class="cancel-btn" data-action="cancel">Cancel</button>
                    </div>
                </div>
            `;
            const ta = container.querySelector('textarea');
            ta.focus();

            const doSave = () => {
                const v = ta.value.trim();
                if (!v) {
                    container.innerHTML = '';
                    return;
                }
                const task = weekData[wi].categories[category][ti];
                if (!task.updates) task.updates = [];
                task.updates.push({ date: today, text: v });

                // Insert the new update INTO the DOM directly (before the editing container)
                const updateEl = document.createElement('div');
                updateEl.className = 'feed-item update';
                const metaDiv = document.createElement('div');
                metaDiv.className = 'feed-meta';
                metaDiv.textContent = `📝 ${today}`;
                const textDiv = document.createElement('div');
                textDiv.className = 'feed-text';
                textDiv.textContent = v;
                updateEl.appendChild(metaDiv);
                updateEl.appendChild(textDiv);

                // Remove "No updates yet" empty state if present
                const cell = container.parentNode;
                const emptyState = cell.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                // Insert the new update right before the editing container
                cell.insertBefore(updateEl, container);

                // Clear the editor
                container.innerHTML = '';

                // Persist to Firebase
                saveData();
            };

            container.querySelector('[data-action="save"]').onclick = doSave;
            container.querySelector('[data-action="cancel"]').onclick = () => {
                container.innerHTML = '';
            };

            // Cmd/Ctrl+Enter to save
            ta.addEventListener('keydown', e => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    e.preventDefault();
                    doSave();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    container.innerHTML = '';
                }
            });
        };

        window.editUpdate = function(wi, category, ti, ui) {
            const wrapId = `update-${wi}-${escAttr(category)}-${ti}-${ui}`;
            const wrap = document.getElementById(wrapId);
            if (!wrap || wrap.dataset.editing === 'true') return;
            wrap.dataset.editing = 'true';

            const update = weekData[wi].categories[category][ti].updates[ui];
            const originalText = update.text;

            // Replace contents with editor
            wrap.innerHTML = `
                <div class="feed-item update">
                    <div class="feed-meta">📝 ${escText(update.date)}</div>
                    <textarea class="inline-textarea"></textarea>
                    <div class="save-row">
                        <button class="save-btn" data-action="save">Save</button>
                        <button class="cancel-btn" data-action="cancel">Cancel</button>
                    </div>
                </div>
            `;
            const ta = wrap.querySelector('textarea');
            ta.value = originalText;
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);

            const restoreView = (text) => {
                wrap.dataset.editing = 'false';
                wrap.innerHTML = `
                    <div class="feed-item update">
                        <div class="feed-meta">📝 ${escText(update.date)}</div>
                        <div class="feed-text"></div>
                    </div>
                    <div class="feed-actions-inline">
                        <button class="feed-action-btn" title="Edit">✎</button>
                        <button class="feed-action-btn danger" title="Delete">🗑</button>
                    </div>
                `;
                wrap.querySelector('.feed-text').textContent = text;
                const [editBtn, deleteBtn] = wrap.querySelectorAll('.feed-action-btn');
                editBtn.onclick = () => window.editUpdate(wi, category, ti, ui);
                deleteBtn.onclick = () => window.deleteUpdate(wi, category, ti, ui);
            };

            const doSave = () => {
                const v = ta.value.trim();
                if (!v) {
                    restoreView(originalText);
                    return;
                }
                if (v === originalText) {
                    restoreView(originalText);
                    return;
                }
                weekData[wi].categories[category][ti].updates[ui].text = v;
                restoreView(v);
                saveData();
            };

            wrap.querySelector('[data-action="save"]').onclick = doSave;
            wrap.querySelector('[data-action="cancel"]').onclick = () => restoreView(originalText);

            ta.addEventListener('keydown', e => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    e.preventDefault();
                    doSave();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    restoreView(originalText);
                }
            });
        };

        window.deleteUpdate = function(wi, category, ti, ui) {
            if (!confirm('Delete this update?')) return;
            const wrapId = `update-${wi}-${escAttr(category)}-${ti}-${ui}`;
            const wrap = document.getElementById(wrapId);

            weekData[wi].categories[category][ti].updates.splice(ui, 1);
            saveData();

            // Need to re-render the task row because indices shifted
            renderWeeks();
        };

        // ─── SUMMARY ─────────────────────────────────────────
        window.toggleSummary = function() {
            const card = document.getElementById('summaryCard');
            card.classList.toggle('collapsed');
            if (!card.classList.contains('collapsed')) renderSummary();
        };

        function renderSummary() {
            const body = document.getElementById('summaryBody');
            const map = {};

            weekData.forEach(week => {
                const order = getCategoryOrder(week);
                order.forEach(cat => {
                    const tasks = week.categories[cat] || [];
                    if (!map[cat]) map[cat] = {};
                    tasks.forEach(t => {
                        if (!map[cat][t.text]) {
                            map[cat][t.text] = { status: t.status, updates: [] };
                        }
                        if (t.updates) map[cat][t.text].updates.push(...t.updates);
                    });
                });
            });

            const entries = Object.entries(map);
            if (entries.length === 0) {
                body.innerHTML = `<div class="empty-state" style="padding:24px 0;">No data yet</div>`;
                return;
            }

            body.innerHTML = entries.map(([cat, tasks]) => {
                const taskList = Object.entries(tasks);
                const counts = { todo: 0, progress: 0, done: 0, blocked: 0 };
                taskList.forEach(([, t]) => counts[t.status] = (counts[t.status] || 0) + 1);

                return `
                    <div class="summary-topic">
                        <div class="summary-topic-header">
                            <div class="summary-topic-name">${escText(cat)}</div>
                            <div class="summary-topic-meta">
                                ${counts.progress > 0 ? `<span class="summary-meta-pill">${counts.progress} in progress</span>` : ''}
                                ${counts.done > 0 ? `<span class="summary-meta-pill">${counts.done} done</span>` : ''}
                                ${counts.todo > 0 ? `<span class="summary-meta-pill">${counts.todo} to do</span>` : ''}
                                ${counts.blocked > 0 ? `<span class="summary-meta-pill">${counts.blocked} blocked</span>` : ''}
                            </div>
                        </div>
                        ${taskList.map(([taskText, info]) => {
                            const sortedUpdates = [...info.updates].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                            const latest = sortedUpdates[0];
                            return `
                                <div class="summary-task">
                                    <select class="status-select ${info.status}" disabled style="width:120px; flex-shrink:0;">
                                        <option>${formatStatus(info.status)}</option>
                                    </select>
                                    <div class="summary-task-content">
                                        <div class="summary-task-name ${info.status === 'done' ? 'done' : ''}">${escText(taskText)}</div>
                                        ${latest ? `
                                            <div class="summary-task-update">
                                                <span class="summary-task-update-date">📝 ${escText(latest.date)}</span>${escText(latest.text)}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }).join('');
        }

        function formatStatus(s) {
            return { todo: 'To Do', progress: 'In Progress', done: 'Done', blocked: 'Blocked' }[s] || s;
        }
    </script>
</body>
</html>
